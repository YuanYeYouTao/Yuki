id = "subscription-monitor"
name = "Subscription Monitor"
version = "1.0.0"
description = "Monitor public feeds and ask Yuki's main Agent to evaluate conditional notifications."
entrypoint = "subscription_monitor:SubscriptionMonitorPlugin"
plugin_api = "3.0"
yuki_requires = ">=3.8.3,<4.0"
permissions = [
  "background.worker",
  "network.http.unrestricted",
  "storage.private",
  "plugin.config.read",
  "plugin.config.write",
  "command.register",
  "notification.publish",
  "notification.agent",
]

[limits]
background_tasks = 1
http_concurrency = 1
storage_mb = 100
prompt_characters = 0
