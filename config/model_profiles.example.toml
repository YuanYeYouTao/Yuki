schema_version = 3
search_connection = "primary_agent"

# Copy to webui-config/model_profiles.toml to configure explicit task routing.
# Secrets stay in environment variables; this file only names them.
# Other vendors and native Claude/Gemini: see model_profiles.providers.example.toml
# and docs/architecture/model-providers.md. Vendor settings never select models by content.

[profiles.primary_agent]
# For deepseek-flash (V4.1). Remove image_input for a text-only model.
provider = "deepseek"
protocol = "responses"
base_url_env = "LLM_BASE_URL"
api_key_env = "LLM_API_KEY"
model_env = "LLM_MODEL"
timeout_seconds = 120.0
max_retries = 2
default_temperature = 0.7
default_max_output_tokens = 8192
thinking_mode = "enabled"
reasoning_effort = "low"
reasoning_effort_env = "LLM_REASONING_EFFORT"
structured_output_mode = "function_tool"
capabilities = ["tools", "reasoning", "long_context", "image_input"]
# Explicit independent DeepSeek search with WEB_SEARCH_BACKEND=deepseek_anthropic.
# The Responses main call does not gain native web_search capability.
search_mode = "external"

[profiles.background_tasks]
provider = "deepseek"
protocol = "chat_completions"
base_url_env = "LLM_FLASH_BASE_URL"
api_key_env = "LLM_FLASH_API_KEY"
model_env = "LLM_FLASH_MODEL"
timeout_seconds = 30.0
max_retries = 1
default_temperature = 0.1
default_max_output_tokens = 4096
thinking_mode = "enabled"
reasoning_effort = "low"
structured_output_mode = "function_tool"
capabilities = ["structured_output", "reasoning"]

[routes]
chat_agent = "primary_agent"
memory_extraction = "background_tasks"
memory_self_reflection = "background_tasks"
memory_dream = "background_tasks"
emoji_replacement = "background_tasks"
automation_agent = "primary_agent"
plugin_agent_session = "primary_agent"
utility_structured = "background_tasks"
conversation_compaction = "background_tasks"
