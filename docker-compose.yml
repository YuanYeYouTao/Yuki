name: qq-ai-bot

services:
  bot:
    image: ghcr.io/yuanyeyoutao/yuki-qqbot:${YUKI_VERSION:?missing}
    platform: linux/amd64
    pull_policy: missing
    init: true
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      CODE_MODE_ENABLED: "false"
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      DATABASE_URL: sqlite+aiosqlite:////app/data/qq_ai_bot.db
      MODEL_PROFILES_FILE: /app/webui-config/model_profiles.toml
      WORKSPACE_DIRECTORY: /app/workspace
      CONVERSATION_MEDIA_CACHE_DIRECTORY: /app/data/conversation-media-cache
      SOCIAL_TRANSFER_DIRECTORY: /app/social-transfer
      SOCIAL_GATEWAY_TRANSFER_DIRECTORY: /yuki-transfer
      SANDBOX_SOCKET: /run/yuki-sandbox/manager.sock
      NAPCAT_CONFIG_OUTPUT: /app/napcat-config/onebot11.json
      NAPCAT_REVERSE_WS_URL: ws://bot:8080/onebot/v11/ws
      SNOWLUMA_CONFIG_OUTPUT: /app/snowluma-data/config/onebot.json
      SNOWLUMA_REVERSE_WS_URL: ws://bot:8080/onebot/v11/snowluma/ws
      SNOWLUMA_UID: ${SNOWLUMA_UID:-1000}
      SNOWLUMA_GID: ${SNOWLUMA_GID:-1000}
      ONEBOT_ACCESS_TOKEN: ${ONEBOT_ACCESS_TOKEN:-replace-with-a-long-random-token}
    expose:
      - "8080"
    volumes:
      - ./data:/app/data
      - ./workspace:/app/workspace
      - ./social-transfer:/app/social-transfer
      - /run/yuki-sandbox:/run/yuki-sandbox:ro
      - ./napcat-config:/app/napcat-config
      - ./snowluma-data:/app/snowluma-data
      - ./config:/app/config:ro
      - ./webui-config:/app/webui-config:ro
      - ./plugins:/app/plugins:ro
    networks:
      - qq-ai-bot-network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/livez', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    stop_grace_period: 20s

  napcat:
    profiles: ["napcat"]
    image: ${NAPCAT_IMAGE:-mlikiowa/napcat-docker:latest}
    restart: unless-stopped
    init: true
    depends_on:
      bot:
        condition: service_healthy
    environment:
      NAPCAT_UID: ${NAPCAT_UID:-0}
      NAPCAT_GID: ${NAPCAT_GID:-0}
      ACCOUNT: ${NAPCAT_ACCOUNT:-}
      WEBUI_TOKEN: ${NAPCAT_WEBUI_TOKEN:-replace-with-a-long-random-webui-token}
      WEBUI_PREFIX: ""
    ports:
      - "127.0.0.1:6099:6099"
    volumes:
      - ./napcat-data:/app/.config/QQ
      - ./napcat-config:/app/napcat/config
      - ./napcat-plugins:/app/napcat/plugins
      - ./social-transfer:/yuki-transfer:ro
    networks:
      - qq-ai-bot-network
    stop_grace_period: 30s

  snowluma:
    profiles: ["snowluma"]
    image: ${SNOWLUMA_IMAGE:-motricseven7/snowluma:latest}
    platform: linux/amd64
    restart: unless-stopped
    init: true
    depends_on:
      bot:
        condition: service_healthy
    shm_size: ${SNOWLUMA_SHM_SIZE:-1gb}
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    environment:
      VNC_PASSWD: ${SNOWLUMA_VNC_PASSWORD:-replace-with-a-long-random-vnc-password}
      SNOWLUMA_UID: ${SNOWLUMA_UID:-1000}
      SNOWLUMA_GID: ${SNOWLUMA_GID:-1000}
      SNOWLUMA_WEBUI_HOST: 0.0.0.0
      SNOWLUMA_WEBUI_PORT: 5099
      SNOWLUMA_LOG_LEVEL: ${SNOWLUMA_LOG_LEVEL:-info}
      SNOWLUMA_SCREEN: ${SNOWLUMA_SCREEN:-1920x1080x24}
      SNOWLUMA_HOOK_AUTOLOAD: ${SNOWLUMA_HOOK_AUTOLOAD:-1}
      SNOWLUMA_EXTRA_QQ_HOMES: ${SNOWLUMA_EXTRA_QQ_HOMES:-}
      SNOWLUMA_QQ_FLAGS: ${SNOWLUMA_QQ_FLAGS:---disable-gpu --disable-software-rasterizer --disable-gpu-compositing}
    ports:
      - "${SNOWLUMA_NOVNC_BIND_ADDRESS:-127.0.0.1}:${SNOWLUMA_NOVNC_PORT:-6081}:6081"
      - "${SNOWLUMA_WEBUI_BIND_ADDRESS:-127.0.0.1}:${SNOWLUMA_WEBUI_HOST_PORT:-5099}:5099"
    volumes:
      - ./snowluma-data:/app/data
      - ./snowluma-qq-config:/app/.config
      - ./snowluma-qq-data:/app/.local/share
      - ./snowluma-extra-accounts:/app/qq-accounts
      - ./social-transfer:/yuki-transfer:ro
    networks:
      - qq-ai-bot-network
    stop_grace_period: 30s

networks:
  qq-ai-bot-network:
    name: qq-ai-bot-network
    driver: bridge
