[project]
name = "yuki-agent-connector"
version = "0.6.0"
description = "Connect local native coding agents to Yuki"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-only"
dependencies = [
  "websockets>=16,<17",
  "platformdirs>=4,<5",
  "python-socks[asyncio]>=2.7,<3",
  "httpx[socks]>=0.28.1,<1",
  "agent-client-protocol==0.12.1",
  "claude-agent-sdk==0.2.172",
  "pyobjc-core>=13,<14 ; sys_platform == 'darwin'",
  "pyobjc-framework-quartz>=13,<14 ; sys_platform == 'darwin'",
  "pyobjc-framework-screencapturekit>=13,<14 ; sys_platform == 'darwin'",
  "pyobjc-framework-applicationservices>=13,<14 ; sys_platform == 'darwin'",
  "comtypes>=1.4,<1.5 ; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "mypy>=1.13,<2",
    "ruff>=0.8,<1",
    "uvicorn>=0.35,<1",
]

[project.scripts]
yuki-agent-connector = "yuki_agent_connector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yuki_agent_connector"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
# pyobjc and comtypes ship no type information; only the screen backends import them.
module = ["Quartz", "ScreenCaptureKit", "ApplicationServices", "objc", "comtypes", "comtypes.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
