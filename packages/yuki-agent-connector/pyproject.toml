[project]
name = "yuki-agent-connector"
version = "0.3.4"
description = "Connect local native coding agents to Yuki"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-only"
dependencies = [
  "websockets>=16,<17",
  "platformdirs>=4,<5",
  "python-socks[asyncio]>=2.7,<3",
  "httpx[socks]>=0.28.1,<1",
  "agent-client-protocol==0.12.1",
  "claude-agent-sdk==0.2.172",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "mypy>=1.13,<2", "ruff>=0.8,<1"]

[project.scripts]
yuki-agent-connector = "yuki_agent_connector.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yuki_agent_connector"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
