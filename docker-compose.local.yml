# Optional, same-computer App-only deployment. The base service remains shared.
services:
  bot:
    image: ${YUKI_LOCAL_IMAGE:-ghcr.io/yuanyeyoutao/yuki:${YUKI_VERSION:?missing}}
    environment:
      YUKI_RUNTIME_UID: "${YUKI_LOCAL_UID:-10001}"
      YUKI_RUNTIME_GID: "${YUKI_LOCAL_GID:-10001}"
    ports: !override
      - "127.0.0.1:${YUKI_LOCAL_PORT:-8080}:8080"
    volumes: !override
      - ./data:/app/data
      - ./character:/app/character
      - ./workspace:/app/workspace
      - ./social-transfer:/app/social-transfer
      - sandbox-run:/run/yuki-sandbox:ro
      - media-cache:/app/data/conversation-media-cache
      - ./snowluma-data:/app/snowluma-data
      - ./config:/app/config:ro
      - ./webui-config:/app/webui-config
      - ./plugins:/app/plugins:ro
  manager:
    image: ${YUKI_LOCAL_IMAGE:-ghcr.io/yuanyeyoutao/yuki:${YUKI_VERSION:?missing}}
    user: "0:${YUKI_LOCAL_GID:-10001}"
    environment:
      YUKI_SANDBOX_PROFILE: ${YUKI_SANDBOX_PROFILE:-desktop}
