# Build both environment images locally, e.g. for an unreleased commit:
#   docker compose -f deploy/sandbox/compose.build.yaml build
# then set YUKI_ENVIRONMENT_IMAGE=yuki-environment:local in the deployment's .env.
name: yuki-sandbox-build
services:
  base:
    image: yuki-environment:local
    build:
      context: ../..
      dockerfile: deploy/sandbox/Dockerfile.environment
  desktop:
    image: yuki-environment:local-desktop
    build:
      context: ../..
      dockerfile: deploy/sandbox/Dockerfile.environment-desktop
      additional_contexts:
        yuki_base: service:base
      args:
        BASE_IMAGE: yuki_base
