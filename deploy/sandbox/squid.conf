# Public HTTP(S) only; no logs of URLs, bodies or credentials.
http_port 3128
visible_hostname yuki-sandbox-egress
dns_nameservers 1.1.1.1 8.8.8.8
acl sandbox src 172.30.251.0/24
acl safe_ports port 80 443
acl tls_ports port 443
acl CONNECT method CONNECT
acl nonpublic dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4 ::/128 ::1/128 fc00::/7 fe80::/10 ff00::/8
http_access deny !safe_ports
http_access deny CONNECT !tls_ports
http_access deny manager
http_access deny to_localhost
http_access deny to_linklocal
http_access deny nonpublic
http_access allow sandbox
http_access deny all
cache deny all
access_log none
cache_log /dev/null
cache_store_log none
forwarded_for delete
via off
shutdown_lifetime 1 seconds
connect_timeout 10 seconds
request_timeout 30 seconds
read_timeout 120 seconds
maximum_object_size 0 KB
