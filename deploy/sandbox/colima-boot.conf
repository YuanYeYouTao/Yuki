# Colima mounts its data disk during cloud-final, after multi-user.target.
# Install on both the storage and Manager units; reenable existing units.
[Unit]
Requires=cloud-final.service
After=cloud-final.service

[Install]
WantedBy=
# Colima stops Docker during cloud-final, then starts it from the host CLI.
WantedBy=cloud-init.target docker.service
