name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Documentation and images alone skip the platform, image and isolation jobs.
  # Lint and the test suites still run: some tests read the documents.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ] || git diff --name-only "$BASE" HEAD \
            | awk '!/^(docs|img)\// && !/\.md$/ { code = 1 } END { exit !code }'; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  vec1:
    name: Vec1 native package (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.31"
          enable-cache: true
      - run: uv build --wheel --out-dir dist
      - name: Tag the actual Linux ABI requirements
        if: runner.os == 'Linux'
        run: |
          original=(dist/*.whl)
          uv tool run --from auditwheel --with patchelf auditwheel repair --wheel-dir repaired "${original[0]}"
          mv "${original[0]}" "$RUNNER_TEMP/unrepaired-vec1.whl"
          cp repaired/*.whl dist/
      - name: Verify the actual platform wheel outside its source tree
        run: uv run --no-project --managed-python --python 3.12 python scripts/verify_vec1_wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: vec1-wheel-${{ matrix.os }}
          path: dist/*.whl
          retention-days: 7

  connector:
    name: Local Agent Connector (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    defaults:
      run:
        working-directory: packages/yuki-agent-connector
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.31"
          enable-cache: true
          cache-dependency-glob: packages/yuki-agent-connector/uv.lock
      - run: uv sync --frozen --python 3.12
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy src
      - name: Let the installed Chrome use its sandbox (Ubuntu 24.04 AppArmor)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Tests (the dedicated-Chrome test opens a real window)
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}uv run --no-sync pytest -q
      - run: uv build --out-dir dist
      - name: Install actual connector wheel without the Bot package
        run: uv run --no-sync python scripts/verify_wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: yuki-agent-connector-${{ matrix.os }}
          path: packages/yuki-agent-connector/dist/*
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connector-stability-${{ matrix.os }}
          path: test-results/connector-stability/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-computer-${{ matrix.os }}
          path: test-results/device-computer/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connector-computer-${{ matrix.os }}
          path: test-results/connector-computer/
          retention-days: 7

  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.31"
          enable-cache: true
      - run: uv sync --frozen --all-extras --python 3.12
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy src

  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.31"
          enable-cache: true
      - run: uv sync --frozen --all-extras --python 3.12
      - name: Install media dependencies
        run: |
          sudo sed -i 's|^URIs:.*|URIs: https://archive.ubuntu.com/ubuntu/|' /etc/apt/sources.list.d/ubuntu.sources
          for attempt in 1 2 3 4 5; do
            sudo apt-get -o Acquire::Retries=3 update && sudo apt-get install -y ffmpeg && break
            [ "$attempt" -lt 5 ] || exit 1
            sleep 30
          done
      - run: ffmpeg -version && ffprobe -version
      - name: Test direct runtime and offline contracts
        run: >-
          uv run --no-sync pytest tests/${{ matrix.suite }} -q
          --strict-markers --junitxml=test-results/${{ matrix.suite }}.xml
      - name: Watchdog E2E artifact
        if: matrix.suite == 'integration'
        run: test -s test-results/watchdog-capacity-incident-e2e.json
      - name: Failed Work abandon E2E artifact
        if: matrix.suite == 'integration'
        run: test -s test-results/failed-work-abandon-storage-e2e.json
      - name: Superuser abandon E2E artifact
        if: matrix.suite == 'integration'
        run: >-
          python3 -c "import json, sys;
          d = json.load(open('test-results/superuser-abandon-failed-work-e2e.json'));
          print(d['scenarios_passed']); sys.exit(0 if d['all_scenarios_passed'] else 1)"
      - name: Watchdog failed Work E2E artifact
        if: matrix.suite == 'integration'
        run: >-
          python3 -c "import json, sys;
          d = json.load(open('test-results/watchdog-failed-work-e2e.json'));
          print(d['scenarios_passed']); sys.exit(0 if d['all_scenarios_passed'] else 1)"
      - name: Model transport failure E2E artifact
        if: matrix.suite == 'integration'
        run: >-
          python3 -c "import json, sys;
          d = json.load(open('test-results/model-transport-failure-e2e.json'));
          print(d['scenarios_passed']); sys.exit(0 if d['all_scenarios_passed'] else 1)"
      - name: Model fallback chain E2E artifact
        if: matrix.suite == 'integration'
        run: >-
          python3 -c "import json, sys;
          d = json.load(open('test-results/model-fallback-chain-e2e.json'));
          print(d['scenarios_passed']); sys.exit(0 if d['all_scenarios_passed'] else 1)"
      - name: Memory extraction tightening E2E artifacts (X1, X3-X5, X8-X16)
        if: matrix.suite == 'integration'
        run: test "$(ls test-results/memory-extraction-tightening/X*.json | wc -l)" -eq 13
      - name: Self-reflection one-episode E2E artifacts (P2.1 §8, §14.1)
        if: matrix.suite == 'integration'
        run: test "$(ls test-results/self-reflection-one-episode/*.json | wc -l)" -eq 2
      - name: ACP connector delegation E2E artifact (steer, resume cwd)
        if: matrix.suite == 'integration'
        run: test -s test-results/acp-connector-delegation/run.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.suite }}
          path: test-results/
          retention-days: 7

  # Real Bot + real connector across the released units. Device protocol 5 is one hard
  # switch (Q4): this Bot with this connector (0.9.0) pairs (Claude and Codex drivers);
  # this Bot with the released 0.8.0 connector and the production Bot with this
  # connector are both refused at the handshake and the connector parks (no loop).
  # Production Bot and released connector are both ad59a686 (currently deployed).
  claude-cross-version:
    name: Connector across Bot and connector versions
    runs-on: ubuntu-24.04
    env:
      RELEASED_CONNECTOR: ad59a686f31efba804643dfe922d1dc28016f7d5
      PRODUCTION_BOT: ad59a686f31efba804643dfe922d1dc28016f7d5
      TEST: tests/integration/test_claude_connector_cross_version_e2e.py
      CODEX_TEST: tests/integration/test_codex_connector_delegation_e2e.py
      RELEASE_TEST: tests/integration/test_claude_release_pending_request_e2e.py
      PARALLEL_TEST: tests/integration/test_delegation_parallel_requests_e2e.py
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.31"
          enable-cache: true
      - run: uv sync --frozen --all-extras --python 3.12
      - name: Extract the released connector and the production Bot sources
        run: |
          mkdir -p "$RUNNER_TEMP/released" "$RUNNER_TEMP/production"
          git archive "$RELEASED_CONNECTOR" packages/yuki-agent-connector/src \
            | tar -x -C "$RUNNER_TEMP/released"
          git archive "$PRODUCTION_BOT" src | tar -x -C "$RUNNER_TEMP/production"
          # The native SQLite extension is built, not tracked; it is the same library.
          mkdir -p "$RUNNER_TEMP/production/src/yuki/_native"
          cp -R src/yuki/_native/. "$RUNNER_TEMP/production/src/yuki/_native/"
      - name: Each pairing (the SDK belongs to the connector's environment)
        run: |
          set -e
          run() {
            uv run --no-sync --with claude-agent-sdk==0.2.172 pytest "$@" -q \
              --strict-markers -o pythonpath="$PYTHONPATH_PAIR"
          }
          PYTHONPATH_PAIR="src packages/yuki-agent-connector/src" \
            run "$TEST" "$CODEX_TEST" "$RELEASE_TEST" "$PARALLEL_TEST"
          PYTHONPATH_PAIR="src $RUNNER_TEMP/released/packages/yuki-agent-connector/src" run "$TEST"
          PYTHONPATH_PAIR="$RUNNER_TEMP/production/src packages/yuki-agent-connector/src" run "$TEST"
          ls test-results/claude-connector-cross-version/ test-results/codex-connector-delegation/ \
            test-results/delegation-parallel-requests/
          test "$(ls test-results/claude-connector-cross-version/ | wc -l)" -eq 3
          test -f test-results/codex-connector-delegation/run.json
          test -f test-results/claude-connector-full-access/run.json
          test -f test-results/claude-release-pending-request/result.json
          test -f test-results/delegation-parallel-requests/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-cross-version
          path: |
            test-results/claude-connector-cross-version/
            test-results/codex-connector-delegation/
            test-results/claude-connector-full-access/
            test-results/claude-release-pending-request/
            test-results/delegation-parallel-requests/
          retention-days: 7

  desktop-headed:
    name: Real headed desktop environment
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Build the actual optional headed environment
        run: |
          docker build -f deploy/sandbox/Dockerfile.environment -t yuki-environment:headed-ci-base .
          docker build -f deploy/sandbox/Dockerfile.environment-desktop \
            --build-arg BASE_IMAGE=yuki-environment:headed-ci-base \
            -t yuki-environment:headed-ci .
      - name: Install the locked test dependencies over the actual image
        run: |
          cat > "$RUNNER_TEMP/Dockerfile.headed-tests" <<'DOCKERFILE'
          FROM ghcr.io/astral-sh/uv:0.11.31 AS uv
          FROM yuki-environment:headed-ci
          COPY --from=uv /uv /usr/local/bin/uv
          # A deployment's Manager mounts these from its code volume; this offline
          # harness has no Manager container, so the image carries them.
          COPY src/yuki/sandbox/desktop_service.py src/yuki/sandbox/yuki_computer.py src/yuki/sandbox/yuki_accessibility.py /opt/yuki-runtime/
          COPY packages/yuki-agent-connector/src/yuki_agent_connector/cdp.py packages/yuki-agent-connector/src/yuki_agent_connector/actions.py /opt/yuki-runtime/yuki_agent_connector/
          COPY --chmod=755 deploy/sandbox/yuki-computer.sh /usr/local/bin/yuki-computer
          ENV UV_PROJECT_ENVIRONMENT=/opt/yuki-tests UV_PYTHON_INSTALL_DIR=/opt/yuki-python
          WORKDIR /opt/yuki-source
          COPY pyproject.toml uv.lock README.md LICENSE ./
          COPY hatch_build.py ./
          COPY scripts/build_vec1.py ./scripts/
          COPY vendor/sqlite-vec1 ./vendor/sqlite-vec1
          COPY src ./src
          RUN apt-get update && apt-get install -y --no-install-recommends gcc libc6-dev \
              && uv python install 3.12.13 \
              && uv sync --frozen --all-extras --no-editable --python 3.12.13 \
              && /opt/yuki-tests/bin/python -c "import sqlite3; c=sqlite3.connect(':memory:'); c.execute(\"CREATE VIRTUAL TABLE f USING fts5(tokens, content='', contentless_delete=1, detail=none, tokenize='ascii')\"); c.execute(\"INSERT INTO f(rowid,tokens) VALUES(1,'capability')\"); c.execute('DELETE FROM f WHERE rowid=1'); print('SQLite', sqlite3.sqlite_version)"
          DOCKERFILE
          docker build -f "$RUNNER_TEMP/Dockerfile.headed-tests" -t yuki-environment:headed-tests .
          python3 scripts/build_vec1.py
      - name: Test real display, browser input, control and original receipts offline
        run: |
          mkdir -p test-results
          docker run --rm --network none --shm-size 512m \
            --entrypoint /opt/yuki-tests/bin/python \
            -e PYTHONPATH=/src/src:/src:/src/packages/yuki-agent-connector/src -e PYTHONDONTWRITEBYTECODE=1 \
            -e YUKI_TEST_CHROMIUM=/usr/bin/chromium \
            -v "$PWD:/src:ro" -v "$PWD/test-results:/results" \
            -v "$PWD/test-results:/src/test-results" -w /src \
            yuki-environment:headed-tests -m pytest \
            tests/unit/test_computer_control.py tests/unit/test_computer_runtime.py \
            tests/unit/test_computer_driver.py \
            tests/unit/test_computer_transport.py tests/unit/test_computer_authority.py \
            tests/unit/test_retired_local_device_history.py \
            tests/unit/test_manager_deployment.py \
            tests/unit/test_computer_observer_lifecycle.py \
            tests/unit/test_computer_actions.py \
            tests/integration/test_computer_browser_e2e.py \
            tests/integration/test_tool_media_long_loop_e2e.py \
            tests/integration/test_desktop_session_e2e.py \
            tests/integration/test_computer_use_e2e.py \
            -q --strict-markers -o cache_dir=/tmp/yuki-pytest-cache \
            --basetemp=/tmp/yuki-pytest --junitxml=/results/desktop-headed.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-desktop-headed
          path: |
            test-results/desktop-headed.xml
            test-results/computer-browser/
            test-results/desktop-session/
            test-results/computer-use/
          retention-days: 7

  sandbox-compose:
    name: Sandbox install with Compose (lite, headless, desktop; ${{ matrix.runtime }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        runtime: [runc, runsc]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Register gVisor with --overlay2=none (the installer then chooses runsc)
        if: matrix.runtime == 'runsc'
        run: |
          # Releases ship runsc with its sidecars, which it expects beside itself.
          url=https://storage.googleapis.com/gvisor/releases/release/latest/$(uname -m)
          mkdir -p "$RUNNER_TEMP/gvisor" && cd "$RUNNER_TEMP/gvisor"
          curl -fsSLO "$url/gvisor.tar.bz2" -fsSLO "$url/gvisor.tar.bz2.sha512"
          sha512sum -c gvisor.tar.bz2.sha512
          tar xjf gvisor.tar.bz2
          sudo install -m 755 runsc containerd-shim-runsc-v1 /usr/local/bin/
          sudo mkdir -p /usr/local/bin/gvisor-bin
          sudo cp -a gvisor-bin/. /usr/local/bin/gvisor-bin/
          sudo /usr/local/bin/runsc install -- --overlay2=none
          sudo systemctl restart docker
          docker version
          docker info --format '{{.Driver}} {{json .Runtimes.runsc}}'
          # runsc needs resolv.conf as a file subpath of the HOME volume, which is also
          # mounted whole; check this engine creates such a container at all.
          docker volume create probe-home >/dev/null
          docker run --rm -v probe-home:/v alpine sh -c 'mkdir -p /v/.config && echo nameserver 8.8.8.8 > /v/.config/resolv.conf'
          docker create --name probe --runtime runsc --mount type=volume,src=probe-home,dst=/home/yuki \
            --mount type=volume,src=probe-home,dst=/etc/resolv.conf,volume-subpath=.config/resolv.conf \
            alpine true && docker rm probe
          docker volume rm probe-home
      - name: Build the release images under their release names
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "VERSION=$version" >> "$GITHUB_ENV"
          docker build --target direct --build-arg "YUKI_VERSION=$version" \
            -t "ghcr.io/yuanyeyoutao/yuki:$version" .
          docker build -f deploy/sandbox/Dockerfile.environment \
            -t "ghcr.io/yuanyeyoutao/yuki-environment:$version" .
          docker build -f deploy/sandbox/Dockerfile.environment-desktop \
            --build-arg "BASE_IMAGE=ghcr.io/yuanyeyoutao/yuki-environment:$version" \
            -t "ghcr.io/yuanyeyoutao/yuki-environment:$version-desktop" .
      - name: Build the deployment bundle
        run: python -m scripts.build_release_bundle --version "$VERSION" --output-dir dist
      - name: Install with install.sh, then use the real Manager, environment and firewall
        run: >-
          python scripts/sandbox_compose_e2e.py --version "$VERSION"
          --bundle "dist/yuki-$VERSION-deploy.tar.gz"
          --directory "$RUNNER_TEMP/yuki-e2e/deployment"
          --artifacts test-results/sandbox-compose --desktop
      - name: Service logs
        if: failure()
        working-directory: ${{ runner.temp }}/yuki-e2e/deployment
        run: docker compose logs --tail 200 manager bot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-compose-${{ matrix.runtime }}
          path: test-results/sandbox-compose/
          retention-days: 7
