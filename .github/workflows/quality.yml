name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Documentation and images alone skip the platform, image and isolation jobs.
  # Lint and the test suites still run: some tests read the documents.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ] || git diff --name-only "$BASE" HEAD \
            | awk '!/^(docs|img)\// && !/\.md$/ { code = 1 } END { exit !code }'; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  vec1:
    name: Vec1 native package (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.31"
          enable-cache: true
      - run: uv build --wheel --out-dir dist
      - name: Tag the actual Linux ABI requirements
        if: runner.os == 'Linux'
        run: |
          original=(dist/*.whl)
          uv tool run --from auditwheel --with patchelf auditwheel repair --wheel-dir repaired "${original[0]}"
          mv "${original[0]}" "$RUNNER_TEMP/unrepaired-vec1.whl"
          cp repaired/*.whl dist/
      - name: Verify the actual platform wheel outside its source tree
        run: uv run --no-project --managed-python --python 3.12 python scripts/verify_vec1_wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: vec1-wheel-${{ matrix.os }}
          path: dist/*.whl
          retention-days: 7

  connector:
    name: Local Agent Connector (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    defaults:
      run:
        working-directory: packages/yuki-agent-connector
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.31"
          enable-cache: true
          cache-dependency-glob: packages/yuki-agent-connector/uv.lock
      - run: uv sync --frozen --python 3.12
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy src
      - name: Let the installed Chrome use its sandbox (Ubuntu 24.04 AppArmor)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Tests (the dedicated-Chrome test opens a real window)
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a ' || '' }}uv run --no-sync pytest -q
      - run: uv build --out-dir dist
      - name: Install actual connector wheel without the Bot package
        run: uv run --no-sync python scripts/verify_wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: yuki-agent-connector-${{ matrix.os }}
          path: packages/yuki-agent-connector/dist/*
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connector-stability-${{ matrix.os }}
          path: test-results/connector-stability/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-computer-${{ matrix.os }}
          path: test-results/device-computer/
          retention-days: 7

  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.31"
          enable-cache: true
      - run: uv sync --frozen --all-extras --python 3.12
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy src

  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.31"
          enable-cache: true
      - run: uv sync --frozen --all-extras --python 3.12
      - name: Install media dependencies
        run: |
          sudo sed -i 's|^URIs:.*|URIs: https://archive.ubuntu.com/ubuntu/|' /etc/apt/sources.list.d/ubuntu.sources
          for attempt in 1 2 3 4 5; do
            sudo apt-get -o Acquire::Retries=3 update && sudo apt-get install -y ffmpeg && break
            [ "$attempt" -lt 5 ] || exit 1
            sleep 30
          done
      - run: ffmpeg -version && ffprobe -version
      - name: Test direct runtime and offline contracts
        run: >-
          uv run --no-sync pytest tests/${{ matrix.suite }} -q -m "not native_worker"
          --strict-markers --junitxml=test-results/${{ matrix.suite }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.suite }}
          path: test-results/
          retention-days: 7

  desktop-headed:
    name: Real headed desktop environment
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Build the actual optional headed environment
        run: |
          docker build -f deploy/sandbox/Dockerfile.environment -t yuki-environment:headed-ci-base .
          docker build -f deploy/sandbox/Dockerfile.environment-desktop \
            --build-arg BASE_IMAGE=yuki-environment:headed-ci-base \
            -t yuki-environment:headed-ci .
      - name: Install the locked test dependencies over the actual image
        run: |
          cat > "$RUNNER_TEMP/Dockerfile.headed-tests" <<'DOCKERFILE'
          FROM ghcr.io/astral-sh/uv:0.11.31 AS uv
          FROM yuki-environment:headed-ci
          COPY --from=uv /uv /usr/local/bin/uv
          # A deployment's Manager mounts these from its code volume; this offline
          # harness has no Manager container, so the image carries them.
          COPY src/yuki/sandbox/desktop_service.py src/yuki/sandbox/yuki_computer.py /opt/yuki-runtime/
          COPY packages/yuki-agent-connector/src/yuki_agent_connector/cdp.py /opt/yuki-runtime/yuki_agent_connector/
          COPY --chmod=755 deploy/sandbox/yuki-computer.sh /usr/local/bin/yuki-computer
          ENV UV_PROJECT_ENVIRONMENT=/opt/yuki-tests UV_PYTHON_INSTALL_DIR=/opt/yuki-python
          WORKDIR /opt/yuki-source
          COPY pyproject.toml uv.lock README.md LICENSE ./
          COPY hatch_build.py ./
          COPY scripts/build_vec1.py ./scripts/
          COPY vendor/sqlite-vec1 ./vendor/sqlite-vec1
          COPY src ./src
          RUN apt-get update && apt-get install -y --no-install-recommends gcc libc6-dev \
              && uv python install 3.12.13 \
              && uv sync --frozen --all-extras --no-editable --python 3.12.13 \
              && /opt/yuki-tests/bin/python -c "import sqlite3; c=sqlite3.connect(':memory:'); c.execute(\"CREATE VIRTUAL TABLE f USING fts5(tokens, content='', contentless_delete=1, detail=none, tokenize='ascii')\"); c.execute(\"INSERT INTO f(rowid,tokens) VALUES(1,'capability')\"); c.execute('DELETE FROM f WHERE rowid=1'); print('SQLite', sqlite3.sqlite_version)"
          DOCKERFILE
          docker build -f "$RUNNER_TEMP/Dockerfile.headed-tests" -t yuki-environment:headed-tests .
          python3 scripts/build_vec1.py
      - name: Test real display, browser input, control and original receipts offline
        run: |
          mkdir -p test-results
          docker run --rm --network none --shm-size 512m \
            --entrypoint /opt/yuki-tests/bin/python \
            -e PYTHONPATH=/src/src:/src:/src/packages/yuki-agent-connector/src -e PYTHONDONTWRITEBYTECODE=1 \
            -e YUKI_TEST_CHROMIUM=/usr/bin/chromium \
            -v "$PWD:/src:ro" -v "$PWD/test-results:/results" \
            -v "$PWD/test-results:/src/test-results" -w /src \
            yuki-environment:headed-tests -m pytest \
            tests/unit/test_computer_control.py tests/unit/test_computer_runtime.py \
            tests/unit/test_computer_driver.py \
            tests/unit/test_computer_transport.py tests/unit/test_computer_authority.py \
            tests/unit/test_retired_local_device_history.py \
            tests/unit/test_manager_deployment.py \
            tests/unit/test_computer_observer_lifecycle.py \
            tests/unit/test_computer_actions.py \
            tests/integration/test_computer_browser_e2e.py \
            tests/integration/test_tool_media_long_loop_e2e.py \
            -q --strict-markers -o cache_dir=/tmp/yuki-pytest-cache \
            --basetemp=/tmp/yuki-pytest --junitxml=/results/desktop-headed.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-desktop-headed
          path: |
            test-results/desktop-headed.xml
            test-results/computer-browser/
          retention-days: 7

  sandbox-compose:
    name: Sandbox install with Compose (lite, then headless)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the release images under their release names
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "VERSION=$version" >> "$GITHUB_ENV"
          docker build --target direct --build-arg "YUKI_VERSION=$version" \
            -t "ghcr.io/yuanyeyoutao/yuki:$version" .
          docker build -f deploy/sandbox/Dockerfile.environment \
            -t "ghcr.io/yuanyeyoutao/yuki-environment:$version" .
          docker build -f deploy/sandbox/Dockerfile.environment-desktop \
            --build-arg "BASE_IMAGE=ghcr.io/yuanyeyoutao/yuki-environment:$version" \
            -t "ghcr.io/yuanyeyoutao/yuki-environment:$version-desktop" .
      - name: Build the deployment bundle
        run: python -m scripts.build_release_bundle --version "$VERSION" --output-dir dist
      - name: Install with install.sh, then use the real Manager, environment and firewall
        run: >-
          python scripts/sandbox_compose_e2e.py --version "$VERSION"
          --bundle "dist/yuki-$VERSION-deploy.tar.gz"
          --directory "$RUNNER_TEMP/yuki-e2e/deployment"
          --artifacts test-results/sandbox-compose
      - name: Service logs
        if: failure()
        working-directory: ${{ runner.temp }}/yuki-e2e/deployment
        run: docker compose logs --tail 200 manager bot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-compose
          path: test-results/sandbox-compose/
          retention-days: 7

  native:
    name: Native CodeMode (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      YUKI_MONTY_BINARY: /opt/yuki-monty/monty
      YUKI_MONTY_LAUNCHER: /opt/yuki-monty/monty-isolated
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.31"
          enable-cache: true
      - run: uv sync --frozen --all-extras --python 3.12
      - name: Install isolation and media dependencies
        run: |
          if [ "$(dpkg --print-architecture)" = amd64 ]; then
            sudo sed -i 's|^URIs:.*|URIs: https://archive.ubuntu.com/ubuntu/|' /etc/apt/sources.list.d/ubuntu.sources
          fi
          for attempt in 1 2 3 4 5; do
            sudo apt-get -o Acquire::Retries=3 update \
              && sudo apt-get install -y bubblewrap apparmor-utils ffmpeg && break
            [ "$attempt" -lt 5 ] || exit 1
            sleep 30
          done
      - name: Build the pinned native distribution
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          bash scripts/build_monty_distribution.sh "$PWD/.cache/monty-ci" "$PWD/.venv/bin/python" build
          wheel=$(python -c 'import json; print(json.load(open(".cache/monty-ci/artifacts.json"))["binding"]["filename"])')
          uv pip install --python .venv/bin/python --no-deps ".cache/monty-ci/wheels/$wheel"
          # Hosted runner images make /opt writable. The real worker contract
          # requires its complete path, including this ancestor, to be immutable.
          stat -c '%a %u:%g %n' / /opt /usr /usr/bin /usr/bin/bwrap
          sudo chown root:root /opt
          sudo chmod 755 /opt
          sudo install -d -o root -g root -m 755 /opt/yuki-monty
          sudo install -o root -g root -m 755 .cache/monty-ci/monty/target/release/monty /opt/yuki-monty/monty
          sudo install -o root -g root -m 755 .cache/monty-ci/monty-isolated /opt/yuki-monty/monty-isolated
          stat -c '%a %u:%g %n' /opt /opt/yuki-monty /opt/yuki-monty/monty /opt/yuki-monty/monty-isolated
      - name: Load the existing launcher isolation policy on the disposable runner
        run: sudo apparmor_parser -r deploy/security/yuki-bot-codemode.apparmor
      - name: Verify actual native execution and isolation
        run: |
          mkdir -p test-results
          aa-exec -p yuki-bot-codemode -- .venv/bin/python scripts/verify_monty_isolation.py \
            --output test-results/monty-isolation.json
      - name: Test native execution, original receipts and recovery
        run: >-
          aa-exec -p yuki-bot-codemode -- .venv/bin/python -m pytest tests -q
          -m native_worker --strict-markers --junitxml=test-results/native.xml
      - name: Exercise the same worker with Docker seccomp and AppArmor together
        run: |
          docker build --target direct -t yuki:native-policy-base .
          docker build --build-context native=.cache/monty-ci -t yuki:native-policy -f - . <<'DOCKERFILE'
          FROM yuki:native-policy-base
          COPY --from=native /monty/target/release/monty /opt/yuki-monty/monty
          COPY --from=native /monty-isolated /opt/yuki-monty/monty-isolated
          COPY --from=native /wheels /opt/yuki-monty/wheels
          RUN /usr/local/bin/python -m pip install --no-deps --target /app/.venv/lib/python3.12/site-packages /opt/yuki-monty/wheels/*.whl
          DOCKERFILE
          sh scripts/verify_codemode_container.sh yuki:native-policy test-results/monty-container-isolation.json
      - name: Save the exact native distribution for isolated replay
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monty-native-distribution-${{ matrix.os }}
          path: |
            .cache/monty-ci/artifacts.json
            .cache/monty-ci/wheels/*.whl
            .cache/monty-ci/monty/target/release/monty
            .cache/monty-ci/monty-isolated
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-native-${{ matrix.os }}
          path: test-results/
          retention-days: 7
