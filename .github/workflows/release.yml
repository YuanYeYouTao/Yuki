name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BOT_IMAGE: ghcr.io/yuanyeyoutao/yuki

jobs:
  wheels:
    name: Vec1 platform wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.31"
          enable-cache: true
      - run: uv build --wheel --out-dir dist
      - name: Tag the actual Linux ABI requirements
        if: runner.os == 'Linux'
        run: |
          original=(dist/*.whl)
          uv tool run --from auditwheel --with patchelf auditwheel repair --wheel-dir repaired "${original[0]}"
          mv "${original[0]}" "$RUNNER_TEMP/unrepaired-vec1.whl"
          cp repaired/*.whl dist/
      - run: uv run --no-project --managed-python --python 3.12 python scripts/verify_vec1_wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: yuki-wheel-${{ matrix.os }}
          path: dist/*.whl
          retention-days: 7

  release:
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve release identity
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python -m scripts.release_validate --tag "$TAG" --require-main-ancestor --main-ref origin/main
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: docker/setup-docker-action@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Build deployment bundle
        run: |
          python -m scripts.build_release_bundle --version "$VERSION" --output-dir dist
      - uses: actions/download-artifact@v4
        with:
          pattern: yuki-wheel-*
          merge-multiple: true
          path: dist
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish or reuse the version image
        run: |
          if docker buildx imagetools inspect "$BOT_IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "Reusing $BOT_IMAGE:$VERSION; both platforms are verified below."
          else
            docker buildx build --platform linux/amd64,linux/arm64 --push --target direct \
              --build-arg "YUKI_VERSION=$VERSION" --build-arg "VCS_REF=$RELEASE_SHA" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --tag "$BOT_IMAGE:$VERSION" .
          fi
      - name: Verify the published image and deployment package
        run: |
          docker logout ghcr.io
          for architecture in amd64 arm64; do
            platform="linux/$architecture"
            root="$RUNNER_TEMP/yuki-deploy-$architecture"
            mkdir -p "$root"
            unzip -q "dist/yuki-$VERSION-deploy.zip" -d "$root"
            deploy_dir="$root/yuki-$VERSION-deploy"
            (cd "$deploy_dir" && YUKI_VERSION="$VERSION" DOCKER_DEFAULT_PLATFORM="$platform" docker compose pull bot)
            python scripts/release_smoke.py --deploy-dir "$deploy_dir" --version "$VERSION" \
              --platform "$platform" --revision "$RELEASE_SHA"
          done
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish latest
        run: |
          docker buildx imagetools create --tag "$BOT_IMAGE:latest" "$BOT_IMAGE:$VERSION"
      - name: Publish or reuse release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$VERSION"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --title "Yuki $VERSION" --notes-file "docs/releases/v$VERSION.md"
          fi
          existing="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          mkdir -p "$RUNNER_TEMP/yuki-existing-assets"
          while IFS= read -r -d '' asset; do
            name="$(basename "$asset")"
            if [[ "$name" == '.env.example' ]]; then
              name='default.env.example'
              cp "$asset" "$RUNNER_TEMP/$name"
              asset="$RUNNER_TEMP/$name"
            fi
            if grep -Fxq "$name" <<< "$existing"; then
              gh release download "$tag" --pattern "$name" --dir "$RUNNER_TEMP/yuki-existing-assets"
              cmp "$asset" "$RUNNER_TEMP/yuki-existing-assets/$name"
            else
              gh release upload "$tag" "$asset"
            fi
          done < <(find dist -maxdepth 1 -type f -print0)
