name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BOT_IMAGE: ghcr.io/yuanyeyoutao/yuki-qqbot

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve release identity
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python -m scripts.release_validate --tag "$TAG" --require-main-ancestor --main-ref origin/main
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Build release image and deployment bundle
        run: |
          docker buildx build --platform linux/amd64 --load --target direct \
            --build-arg "YUKI_VERSION=$VERSION" --build-arg "VCS_REF=$RELEASE_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "$BOT_IMAGE:$VERSION" .
          python -m scripts.build_release_bundle --version "$VERSION" --output-dir dist
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish or reuse the version image
        run: |
          if docker manifest inspect "$BOT_IMAGE:$VERSION" >/dev/null 2>&1; then
            docker pull "$BOT_IMAGE:$VERSION"
            revision="$(docker image inspect "$BOT_IMAGE:$VERSION" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
            test "$revision" = "$RELEASE_SHA"
          else
            docker push "$BOT_IMAGE:$VERSION"
          fi
      - name: Verify the published image and deployment package
        run: |
          docker logout ghcr.io
          docker image rm "$BOT_IMAGE:$VERSION"
          mkdir -p "$RUNNER_TEMP/yuki-deploy"
          unzip -q "dist/yuki-$VERSION-deploy.zip" -d "$RUNNER_TEMP/yuki-deploy"
          deploy_dir="$RUNNER_TEMP/yuki-deploy/yuki-$VERSION-deploy"
          (cd "$deploy_dir" && YUKI_VERSION="$VERSION" docker compose pull bot)
          python scripts/release_smoke.py --deploy-dir "$deploy_dir" --version "$VERSION"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish latest
        run: |
          docker tag "$BOT_IMAGE:$VERSION" "$BOT_IMAGE:latest"
          docker push "$BOT_IMAGE:latest"
      - name: Publish or reuse release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$VERSION"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --title "Yuki $VERSION" --notes-file "docs/releases/v$VERSION.md"
          fi
          existing="$(gh release view "$tag" --json assets --jq '.assets[].name')"
          mkdir -p "$RUNNER_TEMP/yuki-existing-assets"
          while IFS= read -r -d '' asset; do
            name="$(basename "$asset")"
            if [[ "$name" == '.env.example' ]]; then
              name='default.env.example'
              cp "$asset" "$RUNNER_TEMP/$name"
              asset="$RUNNER_TEMP/$name"
            fi
            if grep -Fxq "$name" <<< "$existing"; then
              gh release download "$tag" --pattern "$name" --dir "$RUNNER_TEMP/yuki-existing-assets"
              cmp "$asset" "$RUNNER_TEMP/yuki-existing-assets/$name"
            else
              gh release upload "$tag" "$asset"
            fi
          done < <(find dist -maxdepth 1 -type f -print0)
